services:
  ha-auto-guest-login:
    build:
      context: .
    image: ha-auto-guest-login:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
    ports:
      - "${APP_PORT:-8675}:${PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
