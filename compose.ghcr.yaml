services:
  ha-auto-guest-login:
    # Pin this to a release such as 2.0.0 for reproducible deployments.
    image: ghcr.io/michelnet/ha-auto-guest-login:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
    ports:
      - "${APP_PORT:-8675}:${PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
